[project]
name = "mcp-fortianalyzer"
version = "1.0.0"
description = "Model Context Protocol server for the FortiAnalyzer JSON-RPC API (FastMCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastMCP brings the MCP protocol stack (mcp, mcp-types), httpx, starlette
    # and uvicorn transitively.
    "fastmcp>=4.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    # pyfmg provides the pyFMG.FortiManager client used by the API layer.
    "pyfmg @ git+https://github.com/rstierli/pyfmg.git@2745202a4254963193b79ab3d5617c9cc67f8ce3",
]

[project.scripts]
mcp-fortianalyzer = "mcp_fortianalyzer.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fortianalyzer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (requires real FortiAnalyzer)",
]