name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create a sample config.yaml (real one is gitignored)
        run: |
          cp config.example.yaml config.yaml
          # Replace the placeholder host with a dummy value so the server
          # module can be imported by the tests without a live appliance.
          sed -i 's/host: 192.0.2.10/host: 127.0.0.1/' config.yaml

      - name: Lint with ruff
        run: ruff check src tests

      - name: Run tests with pytest
        run: pytest -q